site_name: metapipe
site_description: 零代码 Meta 分析流水线工具包
site_url: https://liuxin.github.io/metapipe/
repo_name: shelby1028/metapipe
repo_url: https://github.com/shelby1028/metapipe
edit_uri: edit/main/docs/

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 示例数据与工作流: examples.md
  - API 参考:
      - 效应量: api/effects.md
      - 模型: api/models.md
      - 可视化: api/plots.md
      - 诊断: api/diagnostics.md
      - 亚组分析: api/subgroup.md
      - 元回归: api/meta_regression.md
      - PRISMA: api/prisma.md
      - GRADE: api/grade.md
      - 一键报告: api/report.md
      - 命令行: api/cli.md

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
